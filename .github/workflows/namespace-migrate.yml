name: One-time CY to MY namespace migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/namespace-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename namespace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          skip_dirs = {'.git'}
          binary_exts = {'.png','.jpg','.jpeg','.gif','.webp','.ico','.zip','.apk','.woff','.woff2','.ttf','.otf','.pdf'}

          # First rename files carrying the old namespace in their filename.
          paths = sorted([p for p in root.rglob('*') if p.is_file() and not any(part in skip_dirs for part in p.parts)], key=lambda p: len(p.parts), reverse=True)
          for p in paths:
              name = p.name.replace('CY-', 'MY-').replace('cy-', 'my-')
              if name != p.name:
                  dest = p.with_name(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  p.rename(dest)

          literal_replacements = [
              ('IBCY', 'IBMY'),
              ('ibcy', 'ibmy'),
              ('CY_', 'MY_'),
              ('cy_', 'my_'),
              ('CY-', 'MY-'),
              ('cy-', 'my-'),
          ]

          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip_dirs for part in p.parts):
                  continue
              if p.suffix.lower() in binary_exts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              new = text
              for old, repl in literal_replacements:
                  new = new.replace(old, repl)
              new = re.sub(r'(?<![A-Za-z0-9])CY(?![A-Za-z0-9])', 'MY', new)
              new = re.sub(r'(?<![A-Za-z0-9])cy(?![A-Za-z0-9])', 'my', new)
              if new != text:
                  p.write_text(new, encoding='utf-8')

          # This workflow is intentionally self-deleting so no migration-only files remain.
          Path('.github/workflows/namespace-migrate.yml').unlink(missing_ok=True)
          PY

      - name: Verify old namespace is gone
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = [re.compile(x) for x in [r'IBCY', r'ibcy', r'CY_', r'cy_', r'CY-', r'cy-', r'(?<![A-Za-z0-9])CY(?![A-Za-z0-9])', r'(?<![A-Za-z0-9])cy(?![A-Za-z0-9])']]
          binary_exts = {'.png','.jpg','.jpeg','.gif','.webp','.ico','.zip','.apk','.woff','.woff2','.ttf','.otf','.pdf'}
          hits = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in binary_exts:
                  continue
              try: text = p.read_text(encoding='utf-8')
              except Exception: continue
              for i, line in enumerate(text.splitlines(), 1):
                  if any(rx.search(line) for rx in patterns):
                      hits.append(f'{p}:{i}:{line[:180]}')
          if hits:
              print('\n'.join(hits[:200]))
              sys.exit(1)
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rename MY namespace across app' || exit 0
          git push
