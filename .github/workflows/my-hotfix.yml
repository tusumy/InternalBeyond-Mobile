name: MY identity migration hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/my-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix profile migration placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom/my-gateway-defaults.js')
          text = p.read_text(encoding='utf-8')
          bad = "            profile = Object.assign({}, profile);\n        if (profile.id !== 'my_codex_chen') { profile.id = 'my_codex_chen'; changed = true; }\n            if (actor === 'yingying') {"
          good = "            profile = Object.assign({}, profile);\n            if (actor === 'yingying') {"
          if bad not in text:
              raise SystemExit('bad identity insertion not found')
          text = text.replace(bad, good, 1)
          marker = "        var changed = false;\n        profile = Object.assign({}, profile);\n"
          replacement = marker + "        if (profile.id !== 'my_codex_chen') { profile.id = 'my_codex_chen'; changed = true; }\n"
          if marker not in text:
              raise SystemExit('api profile marker not found')
          text = text.replace(marker, replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY
          node --check custom/my-gateway-defaults.js
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom/my-gateway-defaults.js
          git commit -m 'Fix MY profile namespace migration' || exit 0
          git push
