name: Fix MY identity visible names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-my-identity-visible-names.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace visible identity names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom/my-identity.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "name: '莹莹', initial: '莹'": "name: '阿毛', initial: '毛'",
              "name: '澈', initial: '澈'": "name: '玄砚', initial: '砚'",
              '<b>莹莹</b>': '<b>阿毛</b>',
              '<b>澈</b>': '<b>玄砚</b>',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          node --check custom/my-identity.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom/my-identity.js
          git commit -m 'Use A-Mao and Xuan-Yan in MY identity UI' || exit 0
          git push
